{% extends 'base.html' %}{% block title %}Tasks — TaskFlow{% endblock %}{% block content %}<div class="heading"><div><h1>Tasks</h1><p class="muted">Turn plans into focused, achievable work.</p></div><div class="actions"><a class="btn ghost" href="{% url 'task-kanban' %}">Kanban view</a><a class="btn" href="{% url 'task-create' %}">＋ Create task</a></div></div><form class="actions list-filter" method="get"><input class="search" name="q" value="{{ request.GET.q }}" placeholder="Search tasks" aria-label="Search tasks"><select name="status" aria-label="Status"><option value="">All statuses</option>{% for value,label in statuses %}<option value="{{ value }}" {% if request.GET.status == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select><button class="btn secondary">Filter</button><a class="link" href="?mine=1">Assigned to me</a></form><section class="card pad">{% include 'tasks/_rows.html' %}{% include 'components/pagination.html' with page_obj=items %}</section>{% endblock %}
