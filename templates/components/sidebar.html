<aside class="sidebar"><a class="brand" href="{% url 'dashboard' %}"><span class="brandmark">✦</span>TaskFlow</a><nav class="nav" aria-label="Main navigation">{% for item in sidebar_items %}<a href="{{ item.url }}" {% if item.active %}class="active" aria-current="page"{% endif %}><span class="glyph">{{ item.icon }}</span>{{ item.label }}</a>{% endfor %}</nav><div class="sidebar-bottom"><strong>{{ user.get_full_name|default:user.username }}</strong><p class="muted tiny">Your team, in flow.</p><form method="post" action="{% url 'accounts:logout' %}">{% csrf_token %}<button class="btn ghost" type="submit">Sign out</button></form></div></aside>
