<header class="topbar"><form action="{% url 'task-list' %}" method="get"><input class="search" name="q" value="{{ request.GET.q }}" placeholder="Search tasks…" aria-label="Search tasks"></form><div class="topactions"><button class="iconbtn" id="theme-toggle" type="button" aria-label="Toggle color theme">◐</button><a class="iconbtn" href="{% url 'notification-list' %}" aria-label="Notifications">♢ {{ unread_count }}</a><a class="avatar" href="{% url 'accounts:profile' %}" aria-label="Your profile">{{ user.username|first|upper }}</a><form method="post" action="{% url 'accounts:logout' %}">{% csrf_token %}<button class="iconbtn" type="submit" aria-label="Sign out">↪</button></form></div></header>
