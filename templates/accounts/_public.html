<section class="card pad"><div class="profile-head">{% if profile_user.avatar %}<img class="avatar" src="{% url 'accounts:avatar' profile_user.username %}" alt="{{ profile_user.username }} avatar">{% else %}<span class="avatar">{{ profile_user.username|first|upper }}</span>{% endif %}<div><h1>{{ profile_user.get_full_name|default:profile_user.username }}</h1><p class="muted">{{ profile_user.job_title|default:'TaskFlow member' }}</p></div></div><p class="details">{{ profile_user.bio|default:'No bio yet.' }}</p><p class="muted">{{ profile_user.location|default:'' }}</p></section>
